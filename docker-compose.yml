services:
  postgres:
    image: postgres:16-alpine
    container_name: sweety-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sweety_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sweety_db']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./server
    container_name: sweety-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sweety_db
      JWT_SECRET: ${JWT_SECRET:-sweety_local_development_secret_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_URL: http://localhost:5173
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
    container_name: sweety-client
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - app

volumes:
  postgres_data:
